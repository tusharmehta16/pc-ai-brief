# A story only qualifies if it hits at least one AI term AND one insurance term.
# That single rule removes almost all of the noise from general tech feeds.

ai_terms:
  "ai": 3
  "ai-enabled": 4
  "ai-powered": 4
  "artificial intelligence": 3
  "generative ai": 4
  "agentic ai": 5
  "ai agent": 4
  "large language model": 4
  "machine learning": 2
  "foundation model": 3
  "copilot": 2
  "automation": 1
  "gpt": 2
  "claude": 3
  "gemini": 2
  "llm": 3
  "predictive model": 2
  "computer vision": 3

insurance_terms:
  "property and casualty": 5
  "p&c": 5
  "underwriting": 4
  "underwriter": 4
  "claim": 4
  "adjuster": 4
  "actuarial": 3
  "reinsurance": 3
  "reinsurer": 3
  "insurer": 4
  "insurance": 3
  "insurtech": 4
  "broker": 2
  "policyholder": 3
  "premium": 2
  "loss ratio": 4
  "catastrophe": 3
  "specialty lines": 4
  "commercial lines": 4
  "personal lines": 4
  "syndicate": 2
  "mga": 3

