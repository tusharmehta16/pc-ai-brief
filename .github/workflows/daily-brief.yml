name: Daily P&C AI brief

on:
  schedule:
    # 11:05 UTC on weekdays. That is 07:05 Toronto in summer, 06:05 in winter.
    # Cron in GitHub Actions is always UTC and has no DST awareness.
    - cron: "5 11 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build without sending"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_BACKEND: ${{ vars.EMAIL_BACKEND || 'smtp' }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_MODE: ${{ vars.EMAIL_MODE || 'bcc' }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ARCHIVE_BASE_URL: ${{ vars.ARCHIVE_BASE_URL }}
          BRIEF_TZ: ${{ vars.BRIEF_TZ || 'America/Toronto' }}
        run: |
          python src/main.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit archive and dedupe state
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add docs state
          git diff --staged --quiet || git commit -m "Brief for $(date -u +%Y-%m-%d)"
          git push
